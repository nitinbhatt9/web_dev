<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example for list using different listing tags</title>
</head>

<body>
    <h2>
        Ordered List
    </h2>
    <ol>
        <li>First</li>
        <li>Second</li>
    </ol>
    <br>
    <h2>
        Unordered List
    </h2>    
    <ul>
        <li>Item A</li>
        <li>Item B</li>
    </ul>
    <br>
    <h2>
        Definition List
    </h2>    
    <dl>
        <dt>HTML(definition term)</dt>
        <dd>HyperText Markup Language(definition of definition term)</dd>
    </dl>
</body>

</html>
