<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM_DECORATION</title>

    <style>
        form {
            border:solid grey;
            height: 600px;
            width: 450px;
            border-radius: 22px;
        }

        h2 {
            padding-top: 40px;
            text-decoration: solid ;
            color: darkgreen;
            margin-left: 30px;
        }

        div {
            padding-left: 20px;
            align-items: center;
            text-decoration: solid;
            border: 1;
            text-transform: capitalize;
        }

        input {
            display: flex;
            flex-direction: column;
            width: 400px;
            padding: 3px;
        }

        input[type="submit"]{
            background-color:chartreuse;
            cursor: pointer;
            border-radius: 0px;            
        }
        
        body {
            margin-left: 500px;
            height: 800px;
        }
        select{
            width: 410px;
            height: 30px;
        }
    </style>
</head>

<body>
    <form action="#" method="get">
        <h2>
            REGISTRATION FORM
        </h2>
        <br>
        <div>
            <label>First Name:</label>
            <input type="text" name="fname" class="" placeholder="first name" />
        </div>
        <br>
        <div>
            <label>Last Name:</label>
            <input type="text" name="lname" class="" placeholder="last name" />
        </div>
        <br>
        <div>
            <label>Email:</label>
            <input type="email" name="e-mail" class="" placeholder="email" />
        </div>
        <br>
        <div>
            <label>Password:</label>
            <input type="password" name="p" class="" placeholder="max 14 characters only" maxlength="14" />
        </div>
        <br>
        <div>
            <label>Re-type Password:</label>
            <input type="password" name="re-p" class="" placeholder="max 14 characters only" maxlength="14" />
        </div>
        <br>
        <div>
            <label>Contact</label>
            <input type="num" name="p" class="num" placeholder="number" maxlength="10" />
        </div>
        <br>
        <div>
            <label>Gender</label>
            <br>
            <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            </select>     
        </div>
        <br>
        <div>
            <input type="submit" />
        </div>
    </form>
</body>

</html>
