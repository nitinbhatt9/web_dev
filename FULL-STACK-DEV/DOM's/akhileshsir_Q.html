<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom Example_1</title>
    <style>
        /* Smooth transition effect when colors switch */
        body {
            transition: background 2s ease;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <p style="color:rgb(245, 245, 245); background-color: #000000;" id="Change">Click On The Button
        Below...!!!</p>
    <button style="border:solid black 5px; border-radius: 40px;" onclick="ChangeColour()">Click On Me</button>

    <script>
        // Array of all your beautiful gradients
        const gradients = [
            "linear-gradient(135deg, #f857a6, #ff5858)", // 0: Red/Coral
            "linear-gradient(135deg, #1e3c72, #2a5298)", // 1: Blue
            "linear-gradient(135deg, #11998e, #38ef7d)", // 2: Green
            "linear-gradient(135deg, #ffe259, #ffa751)", // 3: Yellow/Gold
            "linear-gradient(135deg, #000000, #434343)", // 4: Black/Dark Charcoal
            "linear-gradient(135deg, #ffffff, #ece9e6)", // 5: White/Soft Silver
            "linear-gradient(135deg, #ff9a9e, #fecfef)", // 6: Pink
            "linear-gradient(135deg, #8e9eab, #eef2f3)", // 7: Grey/Platinum
            "linear-gradient(135deg, #6441a5, #2a0845)", // 8: Purple
            "linear-gradient(135deg, #ff416c, #ff4b2b)", // 9: Orange/Sunset
            "linear-gradient(135deg, #89f7fe, #66a6ff)", // 10: Skyblue
            "linear-gradient(135deg, #a8ff78, #78ffd6)"  // 11: Lightgreen
        ];

        // Keep track of the current index position
        let currentIndex = 0;

        // Set the initial background to Red/Coral right when the page loads
        document.body.style.backgroundImage = gradients[currentIndex];

        function ChangeColour() {
            let bodystyle = document.body.style;

            // Move to the next color in the array. 
            // The '%' operator resets the index back to 0 when it reaches the end.
            currentIndex = (currentIndex + 1) % gradients.length;

            // Apply the new gradient
            bodystyle.backgroundImage = gradients[currentIndex];

            console.log("Changed to gradient index: " + currentIndex);
        }
    </script>
</body>

</html>
