<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example for text formatting using various tags</title>
</head>

<body>
    <b>Bold text</b>
    <br>
    <strong>Important text (semantic)</strong>
    <br>
    <i>Italic text</i>
    <br>
    <em>Emphasized text (semantic)</em>
    <br>
    <u>Underlined text</u>
    <br>
    <mark>Highlighted text</mark>
    <br>
    <small>Smaller text</small>
    <br>
    <del>Deleted text</del>
    <br>
    <ins>Inserted text</ins>
    <br>
    <sub>Subscript</sub>
    <br>
    <sup>Superscript</sup>
</body>

</html>
