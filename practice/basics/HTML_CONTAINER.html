<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example for container tags</title>
</head>
<body>
    <div>This is a block container (div)</div>
    <span>This is an inline container (span)</span>
    <p>This is a paragraph container (p)</p>
    <pre>This preserves formatting and space (pre)</pre>
    <code>console.log ("code snippet")</code>
</body>
</html>
