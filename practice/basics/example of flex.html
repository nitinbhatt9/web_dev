<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example for form editing</title>
    <style>
      .main{
        border: solid black 2px;
        width: 500px;
        height: 600px;
        background-color:  rgb(156, 227, 205);
      }
      body{
        display: flex;
        justify-content: center;
        height: 100vh;
        background-color:rgb(89, 89, 230);
      }
    </style>
</head>
<body>
    <div class="main">
    <div style="font-size: x-large; display: flex; justify-content: center;">
        <p>Login</p>
    </div>
    <div style="display: flex; justify-content: start;">
        <p>Username</p>
        <input type="text" placeholder="Type your username">
    </div>
    <div style="display: flex; justify-content: start;">
        <p>Password</p>
        <input type="password" placeholder="Type your password" maxlength="14">
    </div>
    <div style="font-size: small; display: flex; justify-content: end; border: solid rgb(30, 2, 2) 2px;margin-left: 360px;">
        <p>Forgot password?</p>
    </div>
    <div style="font-size: large; display: flex; justify-content: center; border-top: solid rgb(30, 2, 2) 2px; background-color: rgb(83, 231, 184)">
        <p>Login</p>
    </div>
    <div style="display: flex; justify-content: center; border: solid rgb(30, 2, 2) 2px;">
        <p>Or Sign Up Using</p>
    </div>
    <div style="display: flex; justify-content: center; border-bottom: solid rgb(30, 2, 2) 2px; background-color: rgb(83, 231, 184);">
        <p>SIGN UP</p>
    </div>
    </div>
</body>

</html>
