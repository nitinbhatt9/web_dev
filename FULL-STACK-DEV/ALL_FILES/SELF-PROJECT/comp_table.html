<!DOCTYPE>
<html>

    <head>
	<title>Complex Table Example</title>
	</head>
	
	<table border="2">
	<body>
	<tr>
	    <th rowspan="3">Day</th>
		<th colspan="4">Seminar</th>
	</tr>
	<tr>
	    <th colspan="2">Schedule</th>
		<th colspan="2"rowspan="2">Topic</th>
	</tr>	
	
	<tr>
	    <th>Begin</th>
		<th>End</th>
	</tr>
	
	<tr>
	    <td rowspan="2">Monday</td>
		<td rowspan="2">8:00am</td>
		<td rowspan="2">5:00pm</td>
		<th colspan="2"> Introduction to XML</th>
	</tr>
	
	<tr>
	    <th>Validity DTD and Relax NG</th>
	</tr>
	
	<tr>
	    <td rowspan="3">Tuesday</td>
		<td>8:00a.m</td>
		<td>11:00p.m</td>
		<th rowspan="2">XPath</th>
	</tr>
	
	<tr>
	    <td>11:00a.m</td>
		<td>2:00p.m</td>
	</tr>
    
	<tr>
	    <td>2:00p.m</td>
		<td>5:00p.m</td>
		<th>XSL Transformations</th>
	</tr>
	
	<tr>
	    <td>Wednesday</td>
		<td>8:00a.m</td>
		<td>12:00p.m</td>
		<th>XSL Formatting Objects</th>
	</tr>
	
	</body>
	</table>
</html>
